[project]
name = "sleepdetective"
version = "0.2.0"
description = "Detect drowsiness through video imaging."
authors = [{ name = "khengari77", email = "khengari77@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-contrib-python>=4.11.0.86,<5",
    "pyserial>=3.5,<4",
    "flask>=3.1.0,<4",
    # v1 modules use the legacy mp.solutions API, removed in later 0.10.x
    # releases; PLAN.md Phase 2 (tasks API) is when this pin can move.
    "mediapipe==0.10.21",
    "picamera2>=0.3.25,<0.4 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "python-periphery>=2.4.1,<3",
    "typer>=0.15.2,<0.16",
    "pynmea2>=1.19.0,<2",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "kaggle>=1.7.4.5",
    "gdown>=6.1.0",
    "scikit-learn>=1.7.2",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "huggingface-hub>=2.1.1",
]

# CPU-only torch (PLAN.md §6: no GPU dependency anywhere in the project)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# python-prctl (pulled in by picamera2) is sdist-only and needs libcap headers
# just to build its metadata; declare it statically so locking works off-Pi.
[[tool.uv.dependency-metadata]]
name = "python-prctl"
version = "1.8.1"
requires-dist = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
